
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    # Day 47's multi-process flag — now SAFE, because job state lives in
    # the redis service above, not in any one worker's memory.
    command:
      [
        "uvicorn", "async_classify_api_redis:app",
        "--host", "0.0.0.0", "--port", "8000",
        "--workers", "4"
      ]

volumes:
  redis_data:
