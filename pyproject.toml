[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-ml-engineering-portfolio"
version = "0.1.0"
description = "Practical AI/ML experiments, projects, APIs, and learning work by Aayush Oli."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Aayush Oli" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
