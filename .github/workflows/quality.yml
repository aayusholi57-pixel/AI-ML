name: Python quality

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install core dependencies
        run: python -m pip install -r requirements.txt

      - name: Install test tooling
        run: python -m pip install pytest ruff

      - name: Compile core Python entry points
        run: python -m py_compile model.py route.py servermodel.py

      - name: Run API tests
        run: pytest

      - name: Lint maintained Python entry points
        run: ruff check model.py route.py servermodel.py tests
